[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso27001-evidence-collector"
version = "0.2.0"
description = "Automated ISO/IEC 27001:2022 Annex A evidence collection across enterprise systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahesh Lakmal" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[all]>=5", "ruff>=0.6"]

[project.scripts]
iso27001-evidence = "iso27001_evidence.cli:main"

[project.urls]
Homepage = "https://github.com/larcz94/ISO27001-evidence-collector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iso27001_evidence.mappings" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
